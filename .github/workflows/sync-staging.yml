name: Sync staging with main

# Merges a CI-verified main commit into staging. Triggered by workflow_run
# (not push) so it can only run after CI finishes; the gate step refuses to
# merge unless all three CI workflows succeeded for that exact commit SHA.
#
# One-way (main -> staging) only: this job NEVER writes to main. workflow_run
# also fires for the weekly CodeQL schedule and for workflow_dispatch runs on
# main, so the gate exits early unless the triggering run was a push to main,
# and the CI verdict is scoped to push runs on main. That way PR/cron/dispatch
# runs can never feed the gate or drag staging-only work toward main.

on:
  workflow_run:
    workflows:
      - Playwright Tests
      - CodeQL Advanced
      - SonarCloud analysis
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: read

concurrency:
  group: sync-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
      REPO: ${{ github.repository }}
    steps:
      - name: Gate on all CI workflows passing
        id: gate
        run: |
          # Only a push to main can add a commit that staging needs to catch up
          # on. The other workflow_run triggers (weekly CodeQL schedule, manual
          # SonarCloud dispatch) mean "CI ran", not "main moved" — bail out
          # green instead of reporting them as unsettled.
          if [ "$TRIGGER_EVENT" != push ]; then
            echo "Triggering run was '$TRIGGER_EVENT', not a push — nothing to sync."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          on_main="$(gh api "repos/$REPO/compare/main...$HEAD_SHA" --jq '.status')"
          case "$on_main" in
            behind|identical) echo "$HEAD_SHA is on main" ;;
            *)
              echo "::error::$HEAD_SHA is not on main (compare status: $on_main) — refusing to sync"
              exit 1 ;;
          esac

          # Slim the payload server-side and feed jq via stdin: full run objects
          # passed through argv hit the runner's ARG_MAX ("Argument list too long").
          # event=push&branch=main keeps the verdict to main-branch push CI; the
          # same SHA can also carry pull_request/schedule/workflow_dispatch runs
          # (and Playwright staging-push runs) which must not decide the gate.
          runs="$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=push&branch=main&per_page=100" \
            --jq '[.workflow_runs[] | {name, run_number, status, conclusion}]')"
          pending=""
          for wf in "Playwright Tests" "CodeQL Advanced" "SonarCloud analysis"; do
            conclusion="$(jq -r --arg wf "$wf" '
              (map(select(.name == $wf)) | sort_by(.run_number) | last)
              | if . == null then "missing" else (.conclusion // .status) end' <<<"$runs")"
            case "$conclusion" in
              success|skipped)
                echo "$wf: $conclusion" ;;
              failure|cancelled|timed_out|startup_failure|stale|action_required)
                echo "::error::$wf for $HEAD_SHA concluded '$conclusion' — staging will NOT be synced"
                exit 1 ;;
              *)
                echo "$wf: not settled ('$conclusion') — sync deferred until its CI completes"
                pending=1 ;;
            esac
          done
          if [ -n "$pending" ]; then
            echo "Some CI workflows are not settled for $HEAD_SHA; sync deferred until they complete."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "All CI workflows passed for $HEAD_SHA."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out staging
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Merge verified main into staging
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit -m "Sync staging with main (CI green at ${HEAD_SHA:0:7})" "$HEAD_SHA"
          git push origin staging
