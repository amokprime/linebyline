name: Deploy to GitHub Pages

# Roadmap item 3 (ROADMAP.md), Phase E Tranche 5: cutover pipeline, armed.
# Triggers: push to main (step 2) + workflow_dispatch for smoke-testing from
# staging. Release artifacts live in release.yml (tag-push, contents: write).
#
# The Pages SOURCE flip ("Deploy from a branch" -> "GitHub Actions" in repo
# settings) is the actual cutover moment (step 4). Until it is flipped, push
# runs go green in `build` but `deploy` fails — deploy-pages requires the
# Actions source, and configure-pages deliberately does not flip it (keeping
# the flip a manual, single-moment decision). Flip the source right after
# pushing, then dispatch this workflow once to land the first Actions deploy.
# A push SHA whose deploy run failed before the flip keeps staging's sync
# deferred until the next push (sync-staging.yml's gate only reads push runs).
#
# Rollback after the flip: switch the Pages source back to main:/docs in repo
# settings — the monolith stays in docs/ until Tranche 6 deletes it. Procedure
# documented in SECURITY.md. This workflow joins sync-staging.yml's gate list
# (step 6), so a Pages failure also blocks staging sync.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Vite site
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d #v6.0.0

      - uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae #v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 #v5.0.1
