# ~/.config/espanso/match/linebyline.yml
# Pointer-based context loading. Skills auto-load via
# skills/delivery/scripts/setup-sandbox.sh; snippets only list non-skill files.
# Hardlink to scripts/local/espanso.yml to keep both copies in sync.
matches:
  - trigger: ":clm"
    replace: "Clone the main branch of my repo, https://github.com/amokprime/linebyline.\n"
  - trigger: ":cls"
    replace: "Clone the staging branch of my repo, https://github.com/amokprime/linebyline.\n"
  - trigger: ":onb"
    replace: |
      Clone the staging branch of my repo, https://github.com/amokprime/linebyline. Then read and run `bash skills/delivery/scripts/setup-sandbox.sh` from the repo folder — this installs the project skills into the sandbox's available_skills so their descriptions auto-load (invoke via `Skill(command="name")` instead of Read). Then read these from the repo folder:
      ```
      package.json
      README.md
      AGENTS.md
      MEMORY.md
      ROADMAP.md
      skills/delivery/scripts/prepare.sh
      skills/delivery/scripts/deploy.sh
      scripts/unpack.sh
      ```
      Use Glob/Grep to locate files instead of LS on the repo root (the tree is large). Use subagents (Task tool, Explore type) to read heavy folders in parallel — see `linebyline-SKILL.md` → "Context loading strategy" for guidance.
# This could be a build turn with test verification, or a test-writing turn grounded in app code. Either way, code changes happen. LIMITATIONS moved here since app code changes are the direct cause of limitation uplift or regression. AGENTS is silently re-read.
  - trigger: ":code"
    replace: |
      Read these from the `linebyline/` repo folder:
      ```
      LIMITATIONS.md
      docs/index.html
      src/ (use linebyline-section-index skill to read only relevant sections — don't read the entire folder unless the task requires it)
      eslint.config.mjs
      vite.config.mts
      tsconfig.json
      tsconfig.app.json
      tsconfig.node.json
      tsconfig.vitest.json
      tests/unit/ and tests/helpers/ (read only the files relevant to the current task — use Grep to find test files matching the patched code)
      ```
      Use subagents (Task tool, Explore type) to read src/ and tests/ in parallel when the task spans multiple files.
  - trigger: ":skl"
    replace: |
      Read these from the `linebyline/` repo folder (Skills meta-session — work on agent scaffolding):
      ```
      CONTRIBUTING.md
      MEMORY.md
      skills/ except skills/{linebyline,skill,delivery}/SKILL.md (auto-loaded — invoke via Skill(command="name") when their description matches the task, don't Read them all)
      scripts/ (use Glob to list files, then Read only the ones relevant to the meta-work)
      ai/ except ai/templates/
      ```
      (Historical skill-creation transcripts are at `archive/skills/`; script-creation transcripts at `archive/scripts/`; test-creation transcripts at `archive/tests/` — read those if directly relevant to the meta-work being done.)
